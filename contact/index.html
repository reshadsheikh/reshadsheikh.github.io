<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../site-paths.js"></script>
  <script>
    const siteRoot = document.baseURI;
    fetch(new URL('index.html', siteRoot))
      .then((response) => { if (!response.ok) throw new Error('Page unavailable'); return response.text(); })
      .then((html) => { document.open(); document.write(html.replace('<head>', `<head><base href="${siteRoot}">`)); document.close(); })
      .catch(() => { document.body.textContent = 'This page could not be loaded. Please return to the home page.'; });
  </script>
</head>
<body></body>
</html>
